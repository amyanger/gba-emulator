name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x86_64
            install: sudo apt-get update && sudo apt-get install -y libsdl2-dev
          - os: macos-latest
            asset_suffix: macos-arm64
            install: brew install sdl2

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: ${{ matrix.install }}

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build emulator
        run: cmake --build build --target gba_emulator -j

      - name: Build tests
        run: cmake --build build --target gba_tests -j

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -G TGZ

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gba_emulator-${{ matrix.asset_suffix }}
          path: build/gba_emulator-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
