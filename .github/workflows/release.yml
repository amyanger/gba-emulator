name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x86_64
            install: sudo apt-get update && sudo apt-get install -y libsdl2-dev
            cmake_extra: ""
            cpack_generator: TGZ
            artifact_glob: build/gba_emulator-*.tar.gz
          - os: macos-latest
            asset_suffix: macos-arm64
            install: brew install sdl2
            cmake_extra: >-
              -DMACOS_APP_BUNDLE=ON
              -DMACOS_SDL2_FRAMEWORK=$RUNNER_TEMP/sdl2/SDL2.framework
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
              -DCMAKE_OSX_ARCHITECTURES=arm64
            cpack_generator: DragNDrop
            artifact_glob: build/gba_emulator-*.dmg
          - os: windows-latest
            asset_suffix: windows-x86_64
            install: vcpkg install sdl2:x64-windows
            cmake_extra: -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -A x64
            cpack_generator: ZIP
            artifact_glob: build/gba_emulator-*.zip

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: ${{ matrix.install }}

      - name: Fetch SDL2 framework (macOS)
        if: runner.os == 'macOS'
        run: tools/fetch_sdl2_framework.sh "$RUNNER_TEMP/sdl2"

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build emulator
        run: cmake --build build --target gba_emulator --config Release -j

      - name: Build tests
        run: cmake --build build --target gba_tests --config Release -j

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C Release

      - name: Smoke test Unicode ROM path (Windows)
        if: runner.os == 'Windows'
        env:
          LANG: C.UTF-8
        run: |
          # 192 bytes of filler is a bogus ROM that cartridge_load still accepts, so
          # "ROM loaded:" appears only if fopen found the Unicode path. A missing exe,
          # wrong path or crash leaves no such line and fails the step.
          mkdir -p "build/Pokémon Roms"
          printf 'x%.0s' $(seq 1 192) > "build/Pokémon Roms/tiny.gba"
          ./build/Release/gba_emulator.exe "build/Pokémon Roms/tiny.gba" --headless --frames 1 2>&1 | tee smoke.log || true
          if ! grep -q "ROM loaded:" smoke.log; then echo "Unicode path failed to open"; exit 1; fi

      - name: Package
        working-directory: build
        run: cpack -G ${{ matrix.cpack_generator }} -C Release

      - name: Check app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" build/gba_emulator-*.dmg
          tools/check_mac_bundle.sh "$MNT/GBA Emulator.app"
          hdiutil detach "$MNT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gba_emulator-${{ matrix.asset_suffix }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
